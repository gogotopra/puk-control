<!DOCTYPE html>
<html>
<head>
    <title>KAKA Remote Control</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff00; }
        .computers { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
        }
        .card h3 { margin-top: 0; color: #00ff00; }
        .status-online { color: #00ff00; font-weight: bold; }
        .status-offline { color: #ff0000; font-weight: bold; }
        .btn {
            background: #333;
            color: #fff;
            border: 2px solid #00ff00;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover { background: #444; }
        .cmd-input {
            padding: 8px;
            width: 200px;
            margin: 5px;
            background: #333;
            color: #fff;
            border: 1px solid #00ff00;
            border-radius: 3px;
        }
        .log {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .screenshot-img {
            max-width: 100%;
            max-height: 300px;
            margin-top: 10px;
            border: 2px solid #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 KAKA Remote Control</h1>
        <p>Управление удаленными компьютерами</p>

        <div class="computers" id="computers"></div>
    </div>

    <script>
        const socket = io('wss://puk-control.onrender.com');
        let computers = {};

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('command_done', (data) => {
            const log = document.getElementById(`log-${data.computer_id}`);
            if (log) {
                if (data.result.startsWith('data:image')) {
                    // Это скриншот
                    log.innerHTML = `<img src="${data.result}" class="screenshot-img">`;
                } else {
                    // Текстовый результат
                    log.innerText = data.result;
                }
            }
        });

        function sendCommand(computerId, command) {
            socket.emit('send_command', {
                computer_id: computerId,
                command: command
            });
            
            const log = document.getElementById(`log-${computerId}`);
            if (log) {
                log.innerText = `⏳ Отправлена команда: ${command}`;
            }
        }

        function sendCustom(computerId) {
            const cmd = document.getElementById(`cmd-${computerId}`).value;
            if (cmd) sendCommand(computerId, cmd);
        }

        // Обновление списка компьютеров
        function updateComputers() {
            fetch('/api/computers')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('computers');
                    container.innerHTML = '';
                    
                    data.forEach(comp => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <h3>${comp.name}</h3>
                            <p>ID: ${comp.id}</p>
                            <p>Статус: <span class="status-${comp.status}">${comp.status}</span></p>
                            <div>
                                <button class="btn" onclick="sendCommand('${comp.id}', 'scrin')">📸 Скриншот</button>
                                <button class="btn" onclick="sendCommand('${comp.id}', 'status')">📊 Инфо</button>
                            </div>
                            <div>
                                <input type="text" class="cmd-input" id="cmd-${comp.id}" placeholder="puk! команда">
                                <button class="btn" onclick="sendCustom('${comp.id}')">→</button>
                            </div>
                            <div class="log" id="log-${comp.id}"></div>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        // Обновляем список каждые 5 секунд
        setInterval(updateComputers, 5000);
        updateComputers();
    </script>
</body>
</html>
